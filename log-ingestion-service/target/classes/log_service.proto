syntax = "proto3";

option java_package = "com.axlero.logstream.grpc";
option java_multiple_files = true;

package logstream;

message LogEntry {
  string service_name = 1;
  string level = 2;
  string message = 3;
  int64 timestamp = 4;
}

message LogAck {
  bool received = 1;
}

service LogIngestionService {
  rpc SendLog (LogEntry) returns (LogAck);
}
